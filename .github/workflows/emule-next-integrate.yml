name: eMule Next integrate

on:
  push:
    branches: [develop]
    paths:
      - 'tools/emule-next/**'
      - 'srchybrid/EmuleNext*'
      - 'srchybrid/KnownUsers*'
      - 'srchybrid/DownloadIntelligence*'
      - 'srchybrid/PeerShareScanner*'
      - 'srchybrid/FileLibraryService*'
      - 'srchybrid/FileLibraryWnd*'
      - 'srchybrid/LibraryBrowserService*'
      - 'srchybrid/Search2Service*'
      - 'srchybrid/Search2Wnd*'
      - 'srchybrid/ClientIndex*'
      - 'srchybrid/DownloadIndex*'
      - '.github/workflows/emule-next-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply integration
        run: |
          python tools/emule-next/integrate.py
          python tools/emule-next/activate-features.py

      - name: Verify idempotence
        run: |
          cp -R srchybrid /tmp/emule-next-after-first
          python tools/emule-next/integrate.py
          python tools/emule-next/activate-features.py
          diff -qr /tmp/emule-next-after-first srchybrid

      - name: Commit generated legacy-core changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Integration already current.'
            exit 0
          fi
          git config user.name 'eMule Next Integrator'
          git config user.email 'actions@users.noreply.github.com'
          # Activation scripts are intentionally allowed to materialize changes
          # anywhere in the tracked srchybrid overlay. Staging the complete overlay
          # keeps new lifecycle/UI hooks from silently existing only inside CI.
          git add srchybrid
          git commit -m 'eMule Next: activate runtime services [generated]'
          git push origin HEAD:develop