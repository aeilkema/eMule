name: eMule Next integrate

on:
  push:
    branches: [develop]
    paths:
      - 'tools/emule-next/**'
      - 'srchybrid/EmuleNext*'
      - 'srchybrid/DownloadIntelligence*'
      - 'srchybrid/PeerShareScanner*'
      - 'srchybrid/FileLibraryService*'
      - 'srchybrid/Search2Service*'
      - 'srchybrid/ClientIndex*'
      - 'srchybrid/DownloadIndex*'
      - '.github/workflows/emule-next-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply integration
        run: python tools/emule-next/integrate.py

      - name: Verify idempotence
        run: |
          cp -R srchybrid /tmp/emule-next-after-first
          python tools/emule-next/integrate.py
          diff -qr /tmp/emule-next-after-first srchybrid

      - name: Commit generated legacy-core changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Integration already current.'
            exit 0
          fi
          git config user.name 'eMule Next Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add srchybrid/emule.vcxproj \
                  srchybrid/Emule.cpp \
                  srchybrid/ClientList.h \
                  srchybrid/ClientList.cpp \
                  srchybrid/DownloadQueue.h \
                  srchybrid/DownloadQueue.cpp
          git commit -m 'eMule Next: integrate services into legacy core [generated]'
          git push origin HEAD:develop
